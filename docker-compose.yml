services:
  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: abel_os
    ports:
      - "127.0.0.1:5432:5432"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "127.0.0.1:6333:6333"

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: abel
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  abel-core:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn abel_os.main:app --host 0.0.0.0 --port 8081
    ports:
      - "8081:8081"
    environment:
      ABEL_ENVIRONMENT: dev
      ABEL_MOBILE_MODE: RECOMMEND_ONLY
    depends_on:
      - redis

  ceo-api:
    build:
      context: .
      dockerfile: apps/ceo_api/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      MEMORY_DB_PATH: /app/data/abel_memory.db
      ABEL_JWT_SECRET: ${ABEL_JWT_SECRET:?Set ABEL_JWT_SECRET}
    depends_on:
      - nats
    ports:
      - "8080:8080"
    volumes:
      - abel_data:/app/data

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      MEMORY_DB_PATH: /app/data/abel_memory.db
    depends_on:
      - nats
    volumes:
      - abel_data:/app/data

  osint-orchestrator:
    build:
      context: .
      dockerfile: apps/osint_orchestrator/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      MEMORY_DB_PATH: /app/data/abel_memory.db
    depends_on:
      - nats
    volumes:
      - abel_data:/app/data

  sandbox-runtime:
    build:
      context: .
      dockerfile: apps/sandbox_runtime/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      MEMORY_DB_PATH: /app/data/abel_memory.db
    depends_on:
      - nats
    volumes:
      - abel_data:/app/data

volumes:
  abel_data:
